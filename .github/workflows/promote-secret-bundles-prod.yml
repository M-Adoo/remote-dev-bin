name: Promote Prod Secret Bundles

on:
  workflow_dispatch:
    inputs:
      core:
        description: "Core bundle: keep, latest, or a positive integer version"
        required: true
        default: latest
        type: string
      providers:
        description: "Providers bundle: keep, latest, or a positive integer version"
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  DEPLOYMENT: prod
  TARGET_PROJECT: remote-dev-host-prod
  REMOTE_DEV_CONFIRM_PROD: ${{ vars.REMOTE_DEV_CONFIRM_PROD }}
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: remote-dev-github-deployer@remote-dev-host-prod.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  RUNTIME_SERVICE_ACCOUNT: remote-dev-host-service@remote-dev-host-prod.iam.gserviceaccount.com
  CORE_SECRET: remote-dev-prod-host-service-core
  PROVIDERS_SECRET: remote-dev-prod-host-service-providers
  REGION: us-west1
  SERVICE: remote-dev-host-service
  HOST_SERVICE_PUBLIC_ORIGIN: https://adoo.dev

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Confirm protected production target
        run: |
          set -euo pipefail
          test "$REMOTE_DEV_CONFIRM_PROD" = "$TARGET_PROJECT"
          if [ "$DEPLOYER_SERVICE_ACCOUNT" != "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT" ]; then
            echo "GCP_DEPLOYER_SERVICE_ACCOUNT must exactly match $EXPECTED_DEPLOYER_SERVICE_ACCOUNT" >&2
            exit 1
          fi
      - name: Checkout publisher
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve exact promotion pins
        id: plan
        env:
          CORE_SELECTION: ${{ inputs.core }}
          PROVIDERS_SELECTION: ${{ inputs.providers }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/secret-promotion.XXXXXX")"
          trap 'rm -rf "$TMP_DIR"' EXIT
          gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$TMP_DIR/service.json"
          CURRENT_REVISION="$(jq -er '.status.latestReadyRevisionName | select(type == "string" and length > 0)' "$TMP_DIR/service.json")"
          gcloud run revisions describe "$CURRENT_REVISION" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$TMP_DIR/current-revision.json"
          for BUNDLE in core providers; do
            case "$BUNDLE" in core) SECRET="$CORE_SECRET" ;; providers) SECRET="$PROVIDERS_SECRET" ;; esac
            gcloud secrets versions list "$SECRET" --project "$TARGET_PROJECT" --format=json > "$TMP_DIR/$BUNDLE-versions.json"
            ACCESSOR="$(gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" --flatten='bindings[].members' --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --format='value(bindings.members)')"
            VERSION_MANAGER="$(gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" --flatten='bindings[].members' --filter="bindings.role:roles/secretmanager.secretVersionManager AND bindings.members:serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" --format='value(bindings.members)')"
            test "$ACCESSOR" = "serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
            test "$VERSION_MANAGER" = "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT"
          done
          python3 scripts/publish.py plan-secret-pins --target "$DEPLOYMENT" --mode promotion --service-json "$TMP_DIR/current-revision.json" \
            --core-versions-json "$TMP_DIR/core-versions.json" --providers-versions-json "$TMP_DIR/providers-versions.json" \
            --core "$CORE_SELECTION" --providers "$PROVIDERS_SELECTION" --output "$TMP_DIR/plan.json"
          {
            echo "core_version=$(jq -r '.core.selected' "$TMP_DIR/plan.json")"
            echo "providers_version=$(jq -r '.providers.selected' "$TMP_DIR/plan.json")"
            echo "image=$(jq -r '.image' "$TMP_DIR/plan.json")"
            echo "artifact_ref=$(jq -r '.artifact_ref' "$TMP_DIR/plan.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Deploy exact Secret bundle pins
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --image '${{ steps.plan.outputs.image }}' --region "$REGION" --project "$TARGET_PROJECT" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "REMOTE_DEV_HOST_SERVICE_CONFIG=/app/config/host-service-prod.toml,REMOTE_DEV_HOST_ARTIFACTS_REMOTE_DEV_BIN_REF=${{ steps.plan.outputs.artifact_ref }},REMOTE_DEV_HOST_CORE_SECRETS_VERSION=${{ steps.plan.outputs.core_version }},REMOTE_DEV_HOST_PROVIDER_SECRETS_VERSION=${{ steps.plan.outputs.providers_version }}" \
            --cpu 1 --concurrency 5 --timeout 600 --max-instances 20 --allow-unauthenticated --quiet
      - name: Verify exact pins and readiness
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/promoted-service.json"
          jq -e --arg image '${{ steps.plan.outputs.image }}' --arg ref '${{ steps.plan.outputs.artifact_ref }}' --arg core '${{ steps.plan.outputs.core_version }}' --arg providers '${{ steps.plan.outputs.providers_version }}' \
            '([.spec.template.spec.containers[]?.image] == [$image]) and
             ([.spec.template.spec.containers[]?.env[]? | select(.name == "REMOTE_DEV_HOST_ARTIFACTS_REMOTE_DEV_BIN_REF") | .value] == [$ref]) and
             ([.spec.template.spec.containers[]?.env[]? | select(.name == "REMOTE_DEV_HOST_CORE_SECRETS_VERSION") | .value] == [$core]) and
             ([.spec.template.spec.containers[]?.env[]? | select(.name == "REMOTE_DEV_HOST_PROVIDER_SECRETS_VERSION") | .value] == [$providers])' "$RUNNER_TEMP/promoted-service.json"
          SERVICE_URL="$(jq -r '.status.url' "$RUNNER_TEMP/promoted-service.json")"
          curl -fsS "$SERVICE_URL/ready" -o "$RUNNER_TEMP/ready.json"
          jq -e '.deployment == "prod" and .runtime_api_version == 7 and .status == "ok"' "$RUNNER_TEMP/ready.json"
      - name: Mint deployer ops ID token
        id: ops-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.HOST_SERVICE_PUBLIC_ORIGIN }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify provider refresh
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format='value(status.url)')"
          curl -fsS -X POST -H "authorization: Bearer ${{ steps.ops-auth.outputs.id_token }}" -H 'content-length: 0' "$SERVICE_URL/v1/ops/provider-spots/refresh" -o "$RUNNER_TEMP/provider-refresh.json"
          jq -e '.refresh.failed == 0' "$RUNNER_TEMP/provider-refresh.json"
          {
            echo "### Prod Secret bundle promotion"
            echo "- core version: ${{ steps.plan.outputs.core_version }}"
            echo "- providers version: ${{ steps.plan.outputs.providers_version }}"
          } >> "$GITHUB_STEP_SUMMARY"
