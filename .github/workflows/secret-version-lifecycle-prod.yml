name: Prod Secret Version Lifecycle

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle whose version will change lifecycle state
        required: true
        type: choice
        options: [core, providers]
      version:
        description: Positive integer Secret version
        required: true
        type: string
      action:
        description: Lifecycle action
        required: true
        type: choice
        options: [disable, destroy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  TARGET_PROJECT: remote-dev-host-prod
  REMOTE_DEV_CONFIRM_PROD: ${{ vars.REMOTE_DEV_CONFIRM_PROD }}
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: remote-dev-github-deployer@remote-dev-host-prod.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  REGION: us-west1
  SERVICE: remote-dev-host-service

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Confirm protected production target
        run: |
          set -euo pipefail
          test "$REMOTE_DEV_CONFIRM_PROD" = "$TARGET_PROJECT"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
      - name: Checkout publisher
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Guard every retained revision and apply lifecycle action
        env:
          BUNDLE: ${{ inputs.bundle }}
          VERSION: ${{ inputs.version }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/secret-lifecycle.XXXXXX")"
          trap 'rm -rf "$TMP_DIR"' EXIT
          gcloud run revisions list --service "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$TMP_DIR/revisions.json"
          python3 scripts/publish.py guard-secret-version-lifecycle --target prod \
            --bundle "$BUNDLE" --version "$VERSION" --revisions-json "$TMP_DIR/revisions.json"
          case "$BUNDLE" in
            core) SECRET=remote-dev-prod-host-service-core ;;
            providers) SECRET=remote-dev-prod-host-service-providers ;;
          esac
          case "$ACTION" in
            disable) gcloud secrets versions disable "$VERSION" --secret "$SECRET" --project "$TARGET_PROJECT" --quiet ;;
            destroy) gcloud secrets versions destroy "$VERSION" --secret "$SECRET" --project "$TARGET_PROJECT" --quiet ;;
          esac
