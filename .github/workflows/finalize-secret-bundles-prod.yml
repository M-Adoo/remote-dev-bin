name: Finalize Prod Secret Bundles

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type remote-dev-host-prod to delete legacy revisions and Secret containers"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  TARGET_PROJECT: remote-dev-host-prod
  REMOTE_DEV_CONFIRM_PROD: ${{ vars.REMOTE_DEV_CONFIRM_PROD }}
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: remote-dev-github-deployer@remote-dev-host-prod.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  RUNTIME_SERVICE_ACCOUNT: remote-dev-host-service@remote-dev-host-prod.iam.gserviceaccount.com
  CORE_SECRET: remote-dev-prod-host-service-core
  PROVIDERS_SECRET: remote-dev-prod-host-service-providers
  REGION: us-west1
  SERVICE: remote-dev-host-service
  HOST_SERVICE_PUBLIC_ORIGIN: https://adoo.dev

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Confirm protected destructive target
        env:
          CONFIRM_TARGET: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM_TARGET" = "$TARGET_PROJECT"
          test "$REMOTE_DEV_CONFIRM_PROD" = "$TARGET_PROJECT"
          test "$DEPLOYER_SERVICE_ACCOUNT" = "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT"
      - name: Checkout publisher
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Plan and remove only legacy revisions and Secrets
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/secret-finalize.XXXXXX")"
          trap 'rm -rf "$TMP_DIR"' EXIT
          gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$TMP_DIR/service.json"
          gcloud run revisions list --service "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json > "$TMP_DIR/revisions.json"
          python3 scripts/publish.py plan-secret-finalize --target prod --service-json "$TMP_DIR/service.json" --revisions-json "$TMP_DIR/revisions.json" --output "$TMP_DIR/plan.json"
          while IFS= read -r REVISION; do
            test -n "$REVISION"
            gcloud run revisions delete "$REVISION" --project "$TARGET_PROJECT" --region "$REGION" --quiet
          done < <(jq -r '.delete_legacy_revisions[]' "$TMP_DIR/plan.json")
          while IFS= read -r SECRET; do
            test -n "$SECRET"
            if gcloud secrets describe "$SECRET" --project "$TARGET_PROJECT" --format='value(name)' > /dev/null 2>&1; then
              gcloud secrets delete "$SECRET" --project "$TARGET_PROJECT" --quiet
            fi
          done < <(jq -r '.delete_legacy_secrets[]' "$TMP_DIR/plan.json")
          while IFS= read -r SECRET; do
            if gcloud secrets describe "$SECRET" --project "$TARGET_PROJECT" --format='value(name)' > /dev/null 2>&1; then
              echo "legacy Secret still exists: $SECRET" >&2
              exit 1
            fi
          done < <(jq -r '.delete_legacy_secrets[]' "$TMP_DIR/plan.json")
      - name: Verify final IAM boundary
        run: |
          set -euo pipefail
          OWNER="$(gcloud projects get-iam-policy "$TARGET_PROJECT" --flatten='bindings[].members' --filter='bindings.role=roles/owner AND bindings.members=user:Adoo@outlook.com' --format='value(bindings.members)')"
          test "$OWNER" = 'user:Adoo@outlook.com'
          PROJECT_RUNTIME="$(gcloud projects get-iam-policy "$TARGET_PROJECT" --flatten='bindings[].members' --filter="bindings.role:roles/secretmanager AND bindings.members=serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --format='value(bindings.role)')"
          PROJECT_DEPLOYER="$(gcloud projects get-iam-policy "$TARGET_PROJECT" --flatten='bindings[].members' --filter="bindings.role:roles/secretmanager AND bindings.members=serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" --format='value(bindings.role)')"
          test -z "$PROJECT_RUNTIME"
          test -z "$PROJECT_DEPLOYER"
          FOUND_RUNTIME=0
          FOUND_DEPLOYER=0
          while IFS= read -r SECRET; do
            POLICY="$RUNNER_TEMP/secret-policy.json"
            gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" --format=json > "$POLICY"
            if jq -e --arg member "serviceAccount:$RUNTIME_SERVICE_ACCOUNT" 'any(.bindings[]?; any(.members[]?; . == $member))' "$POLICY" > /dev/null; then
              case "$SECRET" in
                "$CORE_SECRET"|"$PROVIDERS_SECRET")
                  jq -e --arg member "serviceAccount:$RUNTIME_SERVICE_ACCOUNT" 'all(.bindings[]?; (any(.members[]?; . == $member) | not) or .role == "roles/secretmanager.secretAccessor")' "$POLICY" > /dev/null
                  FOUND_RUNTIME=$((FOUND_RUNTIME + 1))
                  ;;
                *) exit 1 ;;
              esac
            fi
            if jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" 'any(.bindings[]?; any(.members[]?; . == $member))' "$POLICY" > /dev/null; then
              case "$SECRET" in
                "$CORE_SECRET"|"$PROVIDERS_SECRET")
                  jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" 'all(.bindings[]?; (any(.members[]?; . == $member) | not) or .role == "roles/secretmanager.secretVersionManager")' "$POLICY" > /dev/null
                  FOUND_DEPLOYER=$((FOUND_DEPLOYER + 1))
                  ;;
                *) exit 1 ;;
              esac
            fi
          done < <(gcloud secrets list --project "$TARGET_PROJECT" --format='value(name)')
          test "$FOUND_RUNTIME" -eq 2
          test "$FOUND_DEPLOYER" -eq 2
      - name: Verify ready
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format='value(status.url)')"
          curl -fsS "$SERVICE_URL/ready" -o "$RUNNER_TEMP/ready.json"
          jq -e '.deployment == "prod" and .runtime_api_version == 7 and .status == "ok"' "$RUNNER_TEMP/ready.json"
      - name: Mint deployer ops ID token
        id: ops-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.HOST_SERVICE_PUBLIC_ORIGIN }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify provider refresh after finalize
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format='value(status.url)')"
          curl -fsS -X POST -H "authorization: Bearer ${{ steps.ops-auth.outputs.id_token }}" -H 'content-length: 0' "$SERVICE_URL/v1/ops/provider-spots/refresh" -o "$RUNNER_TEMP/provider-refresh.json"
          jq -e '.refresh.failed == 0' "$RUNNER_TEMP/provider-refresh.json"
