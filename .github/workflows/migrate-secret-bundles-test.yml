name: Migrate Test Secret Bundles

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: host-service-test-deploy
  cancel-in-progress: false

env:
  DEPLOYMENT: test
  TARGET_PROJECT: remote-dev-host-test
  EXPECTED_DEPLOYER_SERVICE_ACCOUNT: remote-dev-github-deployer@remote-dev-host-test.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  RUNTIME_SERVICE_ACCOUNT: remote-dev-host-service@remote-dev-host-test.iam.gserviceaccount.com
  CORE_SECRET: remote-dev-test-host-service-core
  PROVIDERS_SECRET: remote-dev-test-host-service-providers

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Confirm fixed test identity
        run: |
          set -euo pipefail
          if [ "$DEPLOYER_SERVICE_ACCOUNT" != "$EXPECTED_DEPLOYER_SERVICE_ACCOUNT" ]; then
            echo "GCP_DEPLOYER_SERVICE_ACCOUNT must exactly match $EXPECTED_DEPLOYER_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Migrate legacy payloads into bundle version 1
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d "$RUNNER_TEMP/secret-bundle-migration.XXXXXX")"
          chmod 700 "$TMP_DIR"
          trap 'rm -rf "$TMP_DIR"' EXIT

          for BUNDLE in core providers
          do
            case "$BUNDLE" in
              core) SECRET="$CORE_SECRET" ;;
              providers) SECRET="$PROVIDERS_SECRET" ;;
            esac
            gcloud secrets describe "$SECRET" --project "$TARGET_PROJECT" \
              --format='value(name)' > /dev/null
            gcloud secrets versions list "$SECRET" --project "$TARGET_PROJECT" \
              --format=json > "$TMP_DIR/$BUNDLE-versions.json"
            jq -e 'length == 0' "$TMP_DIR/$BUNDLE-versions.json" > /dev/null || {
              echo "$SECRET already has versions; one-time migration refuses to rerun" >&2
              exit 1
            }
            ACCESSOR="$(gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/secretmanager.secretAccessor AND bindings.members:serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
              --format='value(bindings.members)')"
            VERSION_MANAGER="$(gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/secretmanager.secretVersionManager AND bindings.members:serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" \
              --format='value(bindings.members)')"
            test "$ACCESSOR" = "serviceAccount:$RUNTIME_SERVICE_ACCOUNT"
            test "$VERSION_MANAGER" = "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT"
          done

          LEGACY_SECRETS=(
            remote-dev-test-hostctrl-management-key
            remote-dev-test-accounts-owner-sub
            remote-dev-test-accounts-login-token-key
            remote-dev-test-cloud-provider-aws-credentials
          )
          LEGACY_FILES=(management owner login aws)
          for INDEX in 0 1 2 3
          do
            SECRET="${LEGACY_SECRETS[$INDEX]}"
            FILE="${LEGACY_FILES[$INDEX]}"
            ADMIN="$(gcloud secrets get-iam-policy "$SECRET" --project "$TARGET_PROJECT" \
              --flatten='bindings[].members' \
              --filter="bindings.role:roles/secretmanager.admin AND bindings.members:serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" \
              --format='value(bindings.members)')"
            if [ "$ADMIN" != "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" ]; then
              echo "$SECRET must grant migration-only secretmanager.admin to the exact deployer" >&2
              exit 1
            fi
            gcloud secrets versions access latest --secret "$SECRET" \
              --project "$TARGET_PROJECT" --out-file "$TMP_DIR/$FILE"
            chmod 600 "$TMP_DIR/$FILE"
          done

          python3 scripts/publish.py migrate-secret-bundles \
            --target "$DEPLOYMENT" \
            --management-key-file "$TMP_DIR/management" \
            --owner-sub-file "$TMP_DIR/owner" \
            --login-token-key-file "$TMP_DIR/login" \
            --aws-credentials-file "$TMP_DIR/aws" \
            --core-output "$TMP_DIR/core.toml" \
            --providers-output "$TMP_DIR/providers.toml"
          python3 scripts/publish.py validate-secret-bundle \
            --target "$DEPLOYMENT" --kind core --file "$TMP_DIR/core.toml"
          python3 scripts/publish.py validate-secret-bundle \
            --target "$DEPLOYMENT" --kind providers --file "$TMP_DIR/providers.toml"

          CORE_VERSION="$(gcloud secrets versions add "$CORE_SECRET" \
            --project "$TARGET_PROJECT" --data-file "$TMP_DIR/core.toml" \
            --format='value(name)' | awk -F/ '{print $NF}')"
          PROVIDERS_VERSION="$(gcloud secrets versions add "$PROVIDERS_SECRET" \
            --project "$TARGET_PROJECT" --data-file "$TMP_DIR/providers.toml" \
            --format='value(name)' | awk -F/ '{print $NF}')"
          [[ "$CORE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROVIDERS_VERSION" =~ ^[1-9][0-9]*$ ]]
          test "$(gcloud secrets versions describe "$CORE_VERSION" --secret "$CORE_SECRET" \
            --project "$TARGET_PROJECT" --format='value(state)')" = "ENABLED"
          test "$(gcloud secrets versions describe "$PROVIDERS_VERSION" --secret "$PROVIDERS_SECRET" \
            --project "$TARGET_PROJECT" --format='value(state)')" = "ENABLED"
          {
            echo "### Test Secret bundle migration"
            echo "- core version: $CORE_VERSION"
            echo "- providers version: $PROVIDERS_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
